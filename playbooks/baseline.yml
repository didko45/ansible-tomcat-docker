- name: Baseline for app servers
  hosts: app
  become: true

  vars:
    base_packages:
      - tree
      - vim-enhanced
      - curl
      - chrony

  tasks:
    - name: Install base packages
      ansible.builtin.dnf:
        name: "{{ base_packages }}"
        state: present

    - name: Ensure chronyd is running and enabled
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true

    - name: Set login banner
      ansible.builtin.copy:
        dest: /etc/motd
        content: |
          {{ inventory_hostname }} ({{ ansible_host }}) - managed by Ansible.
          Manual changes will be overwritten.
        owner: root
        group: root
        mode: "0644"

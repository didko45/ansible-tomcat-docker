- name: Container registry on control
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tags: registry
  tasks:
    - name: Install Docker API client dependency
      ansible.builtin.dnf:
        name: python3-requests
        state: present

    - name: Run local container registry
      community.docker.docker_container:
        name: registry
        image: registry:2
        state: started
        restart_policy: always
        published_ports:
          - "5000:5000"
        volumes:
          - registry-data:/var/lib/registry

- name: Application servers
  hosts: app
  become: true
  roles:
    - common
    - docker
    - tomcat_app

- name: Keep control's known_hosts in sync with app servers
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read current ED25519 host keys
      ansible.builtin.command: "ssh-keyscan -t ed25519 {{ hostvars[item].ansible_host }}"
      loop: "{{ groups['app'] }}"
      register: keyscan
      changed_when: false

    - name: Trust host keys by IP
      ansible.builtin.known_hosts:
        name: "{{ hostvars[item.item].ansible_host }}"
        key: "{{ item.stdout }}"
        state: present
      loop: "{{ keyscan.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Trust host keys by name
      ansible.builtin.known_hosts:
        name: "{{ item.item }}"
        key: "{{ item.item }} {{ item.stdout.split(' ', 1)[1] }}"
        state: present
      loop: "{{ keyscan.results }}"
      loop_control:
        label: "{{ item.item }}"
